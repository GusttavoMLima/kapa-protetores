name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - development
      - main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    steps:
      - name: Check out approved commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Validate deployment secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          missing=()
          for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID RENDER_DEPLOY_HOOK_URL; do
            if [ -z "${!variable}" ]; then
              missing+=("$variable")
            fi
          done
          if ((${#missing[@]} > 0)); then
            printf 'Missing deployment secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Pull Vercel environment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          environment=preview
          if [ "$DEPLOY_BRANCH" = 'main' ]; then
            environment=production
          fi
          npx --yes vercel@62.5.0 pull \
            --yes \
            --environment="$environment" \
            --token="$VERCEL_TOKEN"

      - name: Build web for Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          production_args=()
          if [ "$DEPLOY_BRANCH" = 'main' ]; then
            production_args=(--prod)
          fi
          npx --yes vercel@62.5.0 build \
            --token="$VERCEL_TOKEN" \
            "${production_args[@]}"

      - name: Deploy web to Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          production_args=()
          if [ "$DEPLOY_BRANCH" = 'main' ]; then
            production_args=(--prod)
          fi
          npx --yes vercel@62.5.0 deploy \
            --prebuilt \
            --token="$VERCEL_TOKEN" \
            "${production_args[@]}"

      - name: Trigger API deploy on Render
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          separator='?'
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]]; then
            separator='&'
          fi
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${DEPLOY_SHA}"
