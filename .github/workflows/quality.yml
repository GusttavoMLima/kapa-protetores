name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sonar:
    name: Lint and SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.KAPA_SONAR }}
          SONAR_HOST_URL: https://sonarcloud.io
