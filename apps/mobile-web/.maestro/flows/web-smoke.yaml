url: http://localhost:8081/signIn
name: Auth & Validation Smoke Test (Web)
tags:
  - smoke
  - web
env:
  TEST_EMAIL: johndoe@gmail.com
  TEST_PASSWORD: "123456"
---
- launchApp:
    stopApp: false

# 1. Verify Login screen header and elements
- assertVisible: "Bem-vindo de volta"
- assertVisible: "Entre para acompanhar suas adoções e favoritos."

# 2. Validate empty login form submission
- scrollUntilVisible:
    centerElement: true
    element: "Entrar"
    direction: DOWN
- tapOn: "Entrar"
- assertVisible: "A senha é obrigatória"
- scrollUntilVisible:
    centerElement: true
    element: "Formato de e-mail inválido"
    direction: UP
- assertVisible: "Formato de e-mail inválido"

# 3. Navigate to Registration screen (/signUp) and validate empty submission
- scrollUntilVisible:
    centerElement: true
    element: "Cadastre-se"
    direction: DOWN
- tapOn: "Cadastre-se"
- scrollUntilVisible:
    centerElement: true
    element: "Crie sua conta"
    direction: UP
- assertVisible: "Crie sua conta"
- assertVisible: "Junte-se ao Kapa para adotar pets e apoiar protetores."
- scrollUntilVisible:
    centerElement: true
    element: "Li e estou ciente de como o Kapa usa meus dados."
    direction: DOWN
    speed: 60
    timeout: 40000
- tapOn: "Li e estou ciente de como o Kapa usa meus dados."
- scrollUntilVisible:
    centerElement: false
    visibilityPercentage: 50
    element: "Cadastrar"
    direction: DOWN
- tapOn: "Cadastrar"
- scrollUntilVisible:
    centerElement: true
    element: "Confirme sua senha"
    direction: UP
- assertVisible: "Confirme sua senha"
- scrollUntilVisible:
    centerElement: true
    element: "Informe um celular válido com DDD."
    direction: UP
- assertVisible: "Informe um celular válido com DDD."
- scrollUntilVisible:
    centerElement: true
    element: "Informe uma data de nascimento válida."
    direction: UP
- assertVisible: "Informe uma data de nascimento válida."
- scrollUntilVisible:
    centerElement: true
    element: "Formato de e-mail inválido"
    direction: UP
- assertVisible: "Formato de e-mail inválido"
- scrollUntilVisible:
    centerElement: true
    element: "Nome de usuário deve ter no mínimo 3 caracteres"
    direction: UP
- assertVisible: "Nome de usuário deve ter no mínimo 3 caracteres"

# 4. Return to Login screen and submit credentials
- scrollUntilVisible:
    centerElement: false
    visibilityPercentage: 50
    element: "Entrar"
    direction: DOWN
    speed: 60
    timeout: 40000
- tapOn: "Entrar"
- scrollUntilVisible:
    centerElement: true
    element: "Bem-vindo de volta"
    direction: UP
- assertVisible: "Bem-vindo de volta"
- runFlow:
    file: ../subflows/login-user.yaml
    env:
      EMAIL: ${TEST_EMAIL}
      PASSWORD: ${TEST_PASSWORD}
