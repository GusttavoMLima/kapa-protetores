url: http://localhost:8081/signIn
name: Login Screen Test (Web)
tags:
  - smoke
  - web
env:
  TEST_EMAIL: johndoe@gmail.com
  TEST_PASSWORD: "123456"
---
- launchApp:
    stopApp: false
- assertVisible: "Bem-vindo de volta"
- assertVisible: "Entre para acompanhar suas adoções e favoritos."
- runFlow:
    file: ../subflows/login-user.yaml
    env:
      EMAIL: ${TEST_EMAIL}
      PASSWORD: ${TEST_PASSWORD}
- waitForAnimationToEnd
