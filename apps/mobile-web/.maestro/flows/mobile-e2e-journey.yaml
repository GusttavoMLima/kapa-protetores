appId: edu.fatec.kapaprotetores.android
name: Adopter Full E2E Journey (Android)
tags:
  - e2e
  - mobile
env:
  TEST_USERNAME: "Kapa Mobile Tester"
  TEST_PASSWORD: "KapaTest123!"
---
- launchApp:
    clearState: true

# 1. Navigate from Sign In to Sign Up
- assertVisible: "Bem-vindo de volta"
- scrollUntilVisible:
    centerElement: true
    element: "Cadastre-se"
    direction: DOWN
- tapOn: "Cadastre-se"
- scrollUntilVisible:
    centerElement: true
    element: "Crie sua conta"
    direction: UP
- assertVisible: "Crie sua conta"

# 2. Register a new adopter account with a unique random email
- scrollUntilVisible:
    centerElement: true
    element: "Ex: Danilo Alves"
    direction: DOWN
- tapOn: "Ex: Danilo Alves"
- inputText: ${TEST_USERNAME}
- scrollUntilVisible:
    centerElement: true
    element: "seu.email@kapa.com"
    direction: DOWN
- tapOn: "seu.email@kapa.com"
- inputRandomEmail
- scrollUntilVisible:
    centerElement: true
    element: "Selecionar data"
    direction: DOWN
- tapOn: "Selecionar data"
- tapOn: "OK"
- scrollUntilVisible:
    centerElement: true
    element: "(19) 99999-9999"
    direction: DOWN
- tapOn: "(19) 99999-9999"
- inputText: "19998887766"
- scrollUntilVisible:
    centerElement: true
    element: "Mínimo 6 caracteres"
    direction: DOWN
- tapOn: "Mínimo 6 caracteres"
- inputText: ${TEST_PASSWORD}
- scrollUntilVisible:
    centerElement: true
    element: "Repita sua senha"
    direction: DOWN
- tapOn: "Repita sua senha"
- inputText: ${TEST_PASSWORD}
- scrollUntilVisible:
    centerElement: true
    element: "Li e estou ciente de como o Kapa usa meus dados."
    direction: DOWN
    speed: 60
    timeout: 40000
- tapOn: "Li e estou ciente de como o Kapa usa meus dados."
- scrollUntilVisible:
    centerElement: false
    visibilityPercentage: 50
    element: "Cadastrar"
    direction: DOWN
- tapOn: "Cadastrar"

# 3. Complete mandatory 9-step Adopter Profile onboarding
- runFlow: ../subflows/complete-adopter-profile.yaml

# 4. Verify Adopt catalog (initial screen for Adopters)
- scrollUntilVisible:
    centerElement: true
    element: "Buscar por raça"
    direction: UP
- assertVisible: "Buscar por raça"
- tapOn: "Cachorros"
- assertVisible: "Limpar filtros"
- tapOn: "Limpar filtros"

# 5. Navigate to Support & PIX Donation screen
- tapOn: "Apoiar"
- scrollUntilVisible:
    centerElement: true
    element: "Doar via PIX"
    direction: UP
- tapOn: "Doar via PIX"
- assertVisible: "Chave PIX Oficial (CNPJ)"
- assertVisible: "05095176000198"
- scrollUntilVisible:
    centerElement: true
    element: "Copiar Chave PIX"
    direction: DOWN
- tapOn: "Copiar Chave PIX"
- assertVisible: "Chave Copiada com Sucesso!"
- scrollUntilVisible:
    centerElement: true
    element: "Voltar para Apoiar"
    direction: UP
- tapOn: "Voltar para Apoiar"

# 6. Navigate to Volunteer screen from Support card and verify access
- scrollUntilVisible:
    centerElement: true
    element: "Ser Voluntário"
    direction: DOWN
- tapOn: "Ser Voluntário"
- assertVisible: "Um cuidado para a vida toda"
- tapOn: "Voltar ao catálogo"
