services:
  redis:
    image: redis:latest
    container_name: kapa-redis
    command: ["redis-server", "--requirepass", "kapa"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_MAXMEMORY=256mb
      - REDIS_PASSWORD=kapa

  database:
    image: postgres:latest
    container_name: kapa-database
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=docker
      - POSTGRES_USER=docker
      - POSTGRES_DB=kapa

  storage:
    image: quay.io/minio/minio:latest
    container_name: kapa-storage
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    environment:
      MINIO_ROOT_USER: kapa
      MINIO_ROOT_PASSWORD: kapa-local-storage-secret

  storage-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - storage
    entrypoint: >
      /bin/sh -c "until mc alias set local http://storage:9000 kapa kapa-local-storage-secret; do sleep 1; done;
      mc mb --ignore-existing local/kapa-public;
      mc anonymous set download local/kapa-public;"

volumes:
  redis_data:
  database_data:
  storage_data:
