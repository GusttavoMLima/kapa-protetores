# Project Identification
sonar.projectKey=GusttavoMLima_kapa-protetores
sonar.organization=gusttavomlima
sonar.projectName=Kapa Protetores

# Source and Test Files
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/.expo/**,\
  **/dist/**,\
  **/build/**,\
  **/web-build/**,\
  **/coverage/**,\
  **/assets/**,\
  **/*.d.ts,\
  **/*.config.js,\
  **/*.config.mjs,\
  **/*.config.cjs,\
  **/*.config.ts,\
  **/*.json,\
  **/*.svg,\
  **/*.png,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.ico

# Test & Duplication Exclusions
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/types/**,\
  **/*.d.ts,\
  **/*.config.*

sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Coverage Reports
sonar.javascript.lcov.reportPaths=**/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
